<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="Megh3 Backup-as-a-Service architecture: client agents send data through a backup API and scheduler, deduplicated and encrypted, into object storage" font-family="Inter, Arial, sans-serif">
