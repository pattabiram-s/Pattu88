<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="Lifafa architecture: on-premise apps containerised and migrated to AWS with Jenkins CI/CD and Nagios monitoring" font-family="Inter, Arial, sans-serif">
  <rect width="800" height="460" fill="#f4f8f7"/>
  <defs>
    <marker id="arrL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="40" y="54" fill="#0b5c55" font-size="15" font-weight="700" letter-spacing="1">LIFAFA GIFT CARDS · CLOUD MIGRATION</text>

  <!-- Stage 1 -->
  <rect x="40" y="96" width="200" height="110" rx="14" fill="#ffffff" stroke="#cfd6d3"/>
  <text x="140" y="140" text-anchor="middle" fill="#16211e" font-size="18" font-weight="700">On-premise</text>
  <text x="140" y="166" text-anchor="middle" fill="#6f7a75" font-size="14">Laravel / PHP apps</text>
  <text x="140" y="186" text-anchor="middle" fill="#6f7a75" font-size="14">legacy servers</text>

  <!-- Stage 2 -->
  <rect x="300" y="96" width="200" height="110" rx="14" fill="#e2f2ef" stroke="#0f766e"/>
  <text x="400" y="140" text-anchor="middle" fill="#0b5c55" font-size="18" font-weight="700">Containerise</text>
  <text x="400" y="166" text-anchor="middle" fill="#45655e" font-size="14">Docker images</text>
  <text x="400" y="186" text-anchor="middle" fill="#45655e" font-size="14">reproducible builds</text>

  <!-- Stage 3 -->
  <rect x="560" y="96" width="200" height="110" rx="14" fill="#ffffff" stroke="#cfd6d3"/>
  <text x="660" y="140" text-anchor="middle" fill="#16211e" font-size="18" font-weight="700">AWS Cloud</text>
  <text x="660" y="166" text-anchor="middle" fill="#6f7a75" font-size="14">scalable hosting</text>
  <text x="660" y="186" text-anchor="middle" fill="#6f7a75" font-size="14">high availability</text>

  <line x1="246" y1="151" x2="296" y2="151" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrL)"/>
  <line x1="506" y1="151" x2="556" y2="151" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrL)"/>

  <!-- Pipeline strip -->
  <rect x="40" y="260" width="720" height="150" rx="16" fill="#ffffff" stroke="#e0e6e4"/>
  <text x="64" y="296" fill="#0b5c55" font-size="14" font-weight="700" letter-spacing="1">CI/CD PIPELINE</text>

  <g>
    <rect x="64" y="318" width="150" height="62" rx="10" fill="#f4f8f7" stroke="#cfd6d3"/>
    <text x="139" y="355" text-anchor="middle" fill="#16211e" font-size="15" font-weight="600">GitHub</text>
    <rect x="254" y="318" width="150" height="62" rx="10" fill="#f4f8f7" stroke="#cfd6d3"/>
    <text x="329" y="355" text-anchor="middle" fill="#16211e" font-size="15" font-weight="600">Jenkins build</text>
    <rect x="444" y="318" width="150" height="62" rx="10" fill="#f4f8f7" stroke="#cfd6d3"/>
    <text x="519" y="355" text-anchor="middle" fill="#16211e" font-size="15" font-weight="600">Deploy</text>
    <rect x="634" y="318" width="102" height="62" rx="10" fill="#e2f2ef" stroke="#0f766e"/>
    <text x="685" y="348" text-anchor="middle" fill="#0b5c55" font-size="14" font-weight="700">Nagios</text>
    <text x="685" y="366" text-anchor="middle" fill="#45655e" font-size="12">monitoring</text>
    <line x1="220" y1="349" x2="250" y2="349" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrL)"/>
    <line x1="410" y1="349" x2="440" y2="349" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrL)"/>
    <line x1="600" y1="349" x2="630" y2="349" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrL)"/>
  </g>
</svg>
