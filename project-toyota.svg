<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="Toyota TSAM architecture: VMware Tanzu on vSphere running a Kubernetes platform for API and backend services" font-family="Inter, Arial, sans-serif">
  <rect width="800" height="460" fill="#f4f8f7"/>
  <defs>
    <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="40" y="54" fill="#0b5c55" font-size="15" font-weight="700" letter-spacing="1">TOYOTA TSAM · ENTERPRISE PLATFORM</text>

  <!-- Layered stack -->
  <rect x="40" y="86" width="720" height="78" rx="14" fill="#ffffff" stroke="#cfd6d3"/>
  <text x="64" y="120" fill="#16211e" font-size="18" font-weight="700">vSphere / vCenter</text>
  <text x="64" y="144" fill="#6f7a75" font-size="14">Enterprise virtualisation layer</text>

  <rect x="40" y="178" width="720" height="78" rx="14" fill="#e2f2ef" stroke="#0f766e"/>
  <text x="64" y="212" fill="#0b5c55" font-size="18" font-weight="700">VMware Tanzu</text>
  <text x="64" y="236" fill="#45655e" font-size="14">Kubernetes runtime configured on vSphere</text>

  <rect x="40" y="270" width="720" height="78" rx="14" fill="#ffffff" stroke="#cfd6d3"/>
  <text x="64" y="304" fill="#16211e" font-size="18" font-weight="700">Kubernetes platform</text>
  <text x="64" y="328" fill="#6f7a75" font-size="14">Deployments, services, scaling</text>

  <!-- Services row -->
  <rect x="40" y="362" width="350" height="62" rx="12" fill="#f4f8f7" stroke="#cfd6d3"/>
  <text x="215" y="399" text-anchor="middle" fill="#16211e" font-size="15" font-weight="600">API services</text>
  <rect x="410" y="362" width="350" height="62" rx="12" fill="#f4f8f7" stroke="#cfd6d3"/>
  <text x="585" y="399" text-anchor="middle" fill="#16211e" font-size="15" font-weight="600">Backend services</text>

  <!-- down arrows -->
  <line x1="400" y1="166" x2="400" y2="176" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrT)"/>
  <line x1="400" y1="258" x2="400" y2="268" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrT)"/>
  <line x1="400" y1="350" x2="400" y2="360" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrT)"/>
</svg>
